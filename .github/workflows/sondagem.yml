name: Sondagem (temporário)
on: workflow_dispatch
permissions: {}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          set +e
          for u in "https://api.bls.gov/publicAPI/v1/timeseries/data/CES0000000001" "https://api.bls.gov/publicAPI/v2/timeseries/data/CES0000000001?latest=true" "https://oui.doleta.gov/unemploy/csv/ar539.csv" "https://www.dol.gov/ui/data.pdf"; do
            echo "=== $u"; curl -sS -m 20 -D - -o /tmp/o -H "Origin: https://gabrid15-creator.github.io" "$u" | grep -iE "^(HTTP|access-control|cache-control|last-modified)"; head -c 250 /tmp/o | tr '\n' ' '; echo
          done
          echo "=== preflight"; curl -sS -m 20 -D - -o /dev/null -X OPTIONS -H "Origin: https://gabrid15-creator.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type" https://api.bls.gov/publicAPI/v1/timeseries/data/ | grep -iE "^(HTTP|access-control)"
