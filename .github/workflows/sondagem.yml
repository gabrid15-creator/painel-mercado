name: Sondagem (temporário)
on: workflow_dispatch
permissions: {}
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          for q in "countries=US,EU,GB,JP,CH&importance=high,medium" "countries=US,EU,GB,JP,CH&importance=high" "countries=US,EU,GB,JP,CH" "importance=medium"; do
            echo "=== $q"; curl -sS -m 20 -D /tmp/h -o /tmp/c.json "https://biquote.io/api/calendar?$q"; grep -iE "^(HTTP|cache-control|age|x-ratelimit|retry)" /tmp/h; head -c 300 /tmp/c.json; echo
          done
          curl -sS -m 20 -o /tmp/cal.json "https://biquote.io/api/calendar?countries=US,EU,GB,JP,CH"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cal.json'))
          ev=d if isinstance(d,list) else (d.get('events') or d.get('data') or [])
          print(type(d).__name__, list(d)[:5] if isinstance(d,dict) else '', len(ev))
          if ev:
            print(json.dumps(ev[0])[:600])
            com=[e for e in ev if e.get('actual') is not None]
            print('com actual:',len(com))
            for e in sorted(com,key=lambda e:e['time'])[-15:]: print(e['time'],e.get('currency'),e.get('importance'),e['name'][:40],'A',e['actual'],'F',e.get('forecast'),'P',e.get('previous'))
            print('--- proximos sem actual')
            for e in sorted([e for e in ev if e.get('actual') is None],key=lambda e:e['time'])[:10]: print(e['time'],e.get('currency'),e.get('importance'),e['name'][:40],'F',e.get('forecast'))
          PY
          for u in https://biquote.io/terms https://biquote.io/docs/calendar; do
            echo "=================== $u"
            curl -sSL -m 20 -A "Mozilla/5.0" "$u" | python3 -c "import sys,re,html;t=sys.stdin.read();t=re.sub(r'(?s)<(script|style).*?</\1>','',t);print(re.sub(r'\n\s*\n+','\n',html.unescape(re.sub(r'<[^>]+>','\n',t)))[:6000])"
          done
