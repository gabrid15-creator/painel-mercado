name: Sondagem (temporário)
on: workflow_dispatch
permissions: {}
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "=== headers (CORS)"
          curl -sS -m 20 -D - -o /tmp/cal.json -H "Origin: https://gabrid15-creator.github.io" "https://biquote.io/api/calendar?countries=US,EU,GB,JP,CH&importance=high,medium" | grep -iE "^(HTTP|access-control|cache-control|age|x-ratelimit|retry|content-type|date|cf-cache)"
          echo "=== resumo"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cal.json'))
          ev=d if isinstance(d,list) else d.get('events',d)
          print(type(d).__name__, len(ev))
          print(json.dumps(ev[0])[:600])
          com=[e for e in ev if e.get('actual') is not None]
          print('com actual:',len(com))
          for e in sorted(com,key=lambda e:e['time'])[-12:]: print(e['time'],e['currency'],e['importance'],e['name'][:40],'A',e['actual'],'F',e.get('forecast'),'P',e.get('previous'))
          print('--- proximos sem actual')
          for e in sorted([e for e in ev if e.get('actual') is None],key=lambda e:e['time'])[:8]: print(e['time'],e['currency'],e['importance'],e['name'][:40],'F',e.get('forecast'))
          PY
          echo "=== upcoming"; curl -sS -m 20 "https://biquote.io/api/calendar/upcoming" | head -c 600; echo
          for u in https://biquote.io/terms https://biquote.io/terms.html https://biquote.io/docs/calendar https://biquote.io/docs; do
            echo "=================== $u"
            curl -sSL -m 20 -A "Mozilla/5.0" "$u" | python3 -c "import sys,re,html;t=sys.stdin.read();t=re.sub(r'(?s)<(script|style).*?</\1>','',t);print(re.sub(r'\n\s*\n+','\n',html.unescape(re.sub(r'<[^>]+>','\n',t)))[:5000])"
          done
