name: lab-duka
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix: {ano: [2020, 2021, 2022, 2023, 2024, 2025, 2026]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas pyarrow
      - run: python lab/duka.py ${{ matrix.ano }}
      - run: |
          cd duka && git init -q && git checkout -q -b lab-duka-${{ matrix.ano }} && git add . \
          && git -c user.name=bot -c user.email=bot@x commit -qm dados \
          && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" lab-duka-${{ matrix.ano }}
