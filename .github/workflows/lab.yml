name: Laboratório do ouro (separado do painel)
# Teste: roda 1x por dia e grava lab.json só na branch "lab-dados". Não toca no painel nem na branch "dados".
# Para apagar o teste: remover lab/, docs/lab/, este arquivo e a branch lab-dados.
on:
  schedule:
    - cron: "7 10 * * 1-6"   # 07:07 de Brasília, de segunda a sábado
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: lab
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Calcular
        run: mkdir -p out && timeout 180 python3 lab/lab.py out
      - name: Publicar na branch "lab-dados"
        run: |
          cd out
          git init -q -b lab-dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "lab $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lab-dados
