name: Coleta e site
# Dados: a cada 5 min a coleta grava os JSON na branch "dados"; o navegador lê de lá (raw.githubusercontent.com).
# Site: o HTML só é publicado no GitHub Pages quando o código muda (push na main ou execução manual).
# Assim um deploy travado do Pages não segura a atualização dos dados.
on:
  schedule:
    - cron: "2-59/5 * * * *"   # de 5 em 5 min, fora do minuto cheio (o GitHub atrasa menos)
  workflow_dispatch:
    inputs:
      site:
        description: "Publicar também o site (HTML)?"
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    concurrency:
      group: coleta
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dados anteriores
        run: |
          mkdir -p out
          cp docs/data/mi_*.json out/ 2>/dev/null || true
          if git fetch -q --depth=1 origin dados 2>/dev/null; then git archive FETCH_HEAD | tar -x -C out; fi
      - name: Coletar
        run: |
          timeout 300 python3 coletor.py out || true
          [ -f out/mi_ia.json ] || cp docs/data/mi_ia.json out/mi_ia.json
          cat out/mi_status.json || true
      - name: Opções (arquivo da tarefa noturna no Google Drive)
        run: python3 opcoes_drive.py out || true; python3 cme_local.py out || true
      - name: Leitura da IA (de hora em hora ou depois de red folder)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "sem chave: pulando"; exit 0; }
          pip install -q anthropic && timeout 180 python3 ia.py out || true
      - name: Publicar dados na branch "dados"
        run: |
          cd out
          git init -q -b dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "dados $(date -u +%Y-%m-%dT%H:%MZ)"
          # um commit só (força): o histórico de dados não incha o repositório
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
  site:
    # site só quando o código muda (push) ou em execução manual marcando "site"; o cron-job.org só coleta
    if: github.event_name == 'push' || inputs.site == true
    needs: coleta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Montar site (com cópia dos dados mais recentes como reserva)
        run: |
          mkdir -p site && cp -r docs/* site/
          if git fetch -q --depth=1 origin dados 2>/dev/null; then git archive FETCH_HEAD | tar -x -C site/data; fi
          rm -f site/data/digest.txt
          # versão do app.js = commit: o navegador sempre baixa o código novo após cada publicação
          sed -i "s/app.js?v=[^\"]*/app.js?v=${GITHUB_SHA::8}/" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: read
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      # um deploy do Pages preso bloqueia todos os seguintes; cancela os que ficaram pendurados
      - name: Cancelar deploy do Pages preso
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue   # não cancelar o deploy desta própria execução
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "cancelado: $sha" || true
          done
      - id: d
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
